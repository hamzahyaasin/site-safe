   <g id="text_1">
    <text style="font-size: 5.7px; font-family: 'Arial'; fill: #1f2937" transform="translate(94.630008 18.109644)">SOS press, repeat or cancel,</text>
    <text style="font-size: 5.7px; font-family: 'Arial'; fill: #1f2937" transform="translate(108.732164 23.934465)">or 5 s report timer</text>
   </g>
   <g id="text_2">
    <text style="font-size: 5.7px; font-family: 'Arial'; fill: #1f2937" transform="translate(94.14818 52.445929)">ESP32 reads the SOS button</text>
    <text style="font-size: 5.7px; font-family: 'Arial'; fill: #1f2937" transform="translate(103.02593 58.27075)">and the NEO-6M GPS</text>
   </g>
   <g id="text_3">
    <text style="font-size: 5.6px; font-family: 'Arial'; text-anchor: middle; fill: #1f2937" x="131.22" y="89.705287" transform="rotate(-0 131.22 89.705287)">GPS fix valid?</text>
   </g>
   <g id="text_4">
    <text style="font-size: 5.7px; font-family: 'Arial'; fill: #1f2937" transform="translate(254.656359 86.818729)">Send without a</text>
    <text style="font-size: 5.7px; font-family: 'Arial'; fill: #1f2937" transform="translate(263.687297 92.64355)">position</text>
   </g>
   <g id="text_5">
    <text style="font-size: 5.7px; font-family: 'Arial'; fill: #1f2937" transform="translate(93.840023 121.186051)">Build JSON: vest ID, position,</text>
    <text style="font-size: 5.7px; font-family: 'Arial'; fill: #1f2937" transform="translate(101.915766 127.094858)">SOS state, press count</text>
   </g>
   <g id="text_6">
    <text style="font-size: 5.7px; font-family: 'Arial'; fill: #1f2937" transform="translate(83.915789 155.488937)">POST over Wi-Fi with a device token;</text>
    <text style="font-size: 5.7px; font-family: 'Arial'; fill: #1f2937" transform="translate(98.590172 161.397744)">SOS retried every second</text>
   </g>
   <g id="text_7">
    <text style="font-size: 5.7px; font-family: 'Arial'; fill: #1f2937" transform="translate(92.88082 189.937129)">API validates; update position,</text>
    <text style="font-size: 5.7px; font-family: 'Arial'; fill: #1f2937" transform="translate(100.486758 195.76195)">SOS state and last seen</text>
   </g>
   <g id="text_8">
    <text style="font-size: 5.6px; font-family: 'Arial'; text-anchor: middle; fill: #1f2937" x="131.22" y="227.232362" transform="rotate(-0 131.22 227.232362)">New SOS press?</text>
   </g>
   <g id="text_9">
    <text style="font-size: 5.7px; font-family: 'Arial'; fill: #1f2937" transform="translate(239.407969 224.236586)">Raise CRITICAL SOS alert</text>
    <text style="font-size: 5.7px; font-family: 'Arial'; fill: #1f2937" transform="translate(249.753914 230.141296)">(cancel resolves it)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 5.6px; font-family: 'Arial'; text-anchor: middle; fill: #1f2937" x="131.22" y="261.569287" transform="rotate(-0 131.22 261.569287)">Inside a restricted zone?</text>
   </g>
   <g id="text_11">
    <text style="font-size: 5.7px; font-family: 'Arial'; fill: #1f2937" transform="translate(244.052578 258.719244)">Raise ZONE_BREACH</text>
    <text style="font-size: 5.7px; font-family: 'Arial'; fill: #1f2937" transform="translate(267.966305 264.544065)">alert</text>
   </g>
   <g id="text_12">
    <text style="font-size: 5.7px; font-family: 'Arial'; fill: #1f2937" transform="translate(93.358641 293.02213)">Log zone entry; show the vest</text>
    <text style="font-size: 5.7px; font-family: 'Arial'; fill: #1f2937" transform="translate(111.734906 298.913748)">on the site map</text>
   </g>
   <g id="text_13">
