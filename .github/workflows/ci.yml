name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sitesafe
          POSTGRES_USER: sitesafe
          POSTGRES_PASSWORD: sitesafe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sitesafe" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SECRET_KEY: ci-only-not-secret
      DB_NAME: sitesafe
      DB_USER: sitesafe
      DB_PASSWORD: sitesafe
      DB_HOST: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: Tests on PostgreSQL
        run: python manage.py test --noinput
      - name: Tests on SQLite
        run: python manage.py test --settings=sitesafe.test_settings

  ai-module:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-module
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ai-module/requirements-vision.txt
      # CPU-only torch keeps the install small; inference.py imports ultralytics.
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-vision.txt opencv-python-headless
      - run: python -m unittest test_activity_events test_fire_detection test_identity test_inference_config test_dataset_audit test_prepare_dataset_v2 test_event_outbox test_ppe_episodes test_evidence
      - run: python -m unittest test_prepare_fire_dataset
        working-directory: ai-module/fire

  tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r measure/requirements.txt
      - run: python -m unittest test_vest_simulator
      - run: python -m unittest test_measure
        working-directory: tools/measure

  report-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: report-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: report-service/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
