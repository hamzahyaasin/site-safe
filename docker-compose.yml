# Full Site-Safe stack for a demo machine:
#   cp .env.docker.example .env.docker   # then set SECRET_KEY etc.
#   docker compose --env-file .env.docker up --build
# Dashboard: http://localhost:8080   API: http://localhost:8000
# The camera pipeline (ai-module) runs natively on the host for webcam access.

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-sitesafe}
      POSTGRES_USER: ${DB_USER:-sitesafe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.docker}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:1883:1883"

  backend:
    build: ./backend
    env_file: .env.docker
    environment: &backend-env
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      MQTT_BROKER_HOST: mqtt
      REPORT_SERVICE_URL: http://report-service:3001/generate
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  mqtt-consumer:
    build: ./backend
    command: ["python", "manage.py", "run_mqtt_consumer"]
    env_file: .env.docker
    environment: *backend-env
    depends_on:
      backend: { condition: service_started }
      mqtt: { condition: service_started }
    restart: unless-stopped

  presence-monitor:
    build: ./backend
    command: ["python", "manage.py", "run_presence_monitor"]
    env_file: .env.docker
    environment: *backend-env
    depends_on:
      backend: { condition: service_started }
    restart: unless-stopped

  report-service:
    build: ./report-service
    environment:
      DJANGO_API_URL: http://backend:8000/api/

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api/
        VITE_WS_URL: ws://localhost:8000/ws/dashboard/
        VITE_SITE_NAME: ${SITE_NAME:-Site-Safe}
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db-data:
  media:
